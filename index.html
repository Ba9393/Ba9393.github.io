<script>
  const toggleSwitch = document.querySelector('.switch input[type="checkbox"]');
  const body = document.body;
  const elements = document.querySelectorAll("body > :not(.topnav), body");

  function updateTheme() {
    elements.forEach(element => {
        if (toggleSwitch.checked) {
            element.style.backgroundColor = '#202020';
            element.style.color = '#ffffff';
            if (element.classList.contains('p1')) {
                element.style.backgroundColor = '#111111';
                element.style.border = "5px solid #000000";
            }
        } else {
            element.style.backgroundColor = '#ffffff';
            element.style.color = '#000000';
            if (element.classList.contains('p1')) {
                element.style.backgroundColor = '#f0f0f0';
                element.style.border = "5px solid #a0a0a0";
            }
        }
    });
  }

  toggleSwitch.addEventListener('change', updateTheme);
  updateTheme();
</script>
